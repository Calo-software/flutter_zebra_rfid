plugins {
    id("com.android.library")
    id("org.jetbrains.kotlin.android")
}

group = "nz.calo.flutter_zebra_rfid"
version = "1.0-SNAPSHOT"

def pluginAndroidDir = buildscript.sourceFile.parentFile

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(17))
    }
}

android {
    namespace = "nz.calo.flutter_zebra_rfid"
    compileSdk = 36

    defaultConfig {
        // Zebra API3 2.0.5.275 sample apps declare minSdkVersion 30.
        // If consumers need API <30 they must use an earlier SDK bundle.
        minSdk = 30
        // (No targetSdk needed for library; rely on consumer constraints)
        
        // Consumer ProGuard rules - automatically applied to apps using this plugin
        consumerProguardFiles 'proguard-rules.pro'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()
            testLogging {
                events("passed", "skipped", "failed")
                showStandardStreams = false
            }
        }
    }
    lint {
        abortOnError = false
    }
    buildFeatures {
        buildConfig = false
    }
}

repositories {
    google()
    mavenCentral()
    // Local Maven repo populated below
    maven { url = uri(new File(pluginAndroidDir, "localMaven")) }
}

def zebraGroupId = 'com.zebra.rfid.local'
def zebraAarDir = new File(pluginAndroidDir, 'RFIDAPI3Library')
def zebraLocalMaven = new File(pluginAndroidDir, 'localMaven')

rootProject.allprojects { candidate ->
    candidate.repositories {
        maven { url = uri(zebraLocalMaven) }
    }
}

def localProperties = new Properties()
def localPropertiesFile = file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def flutterSdk = localProperties.getProperty('flutter.sdk')
def flutterEmbeddingJar = flutterSdk == null ? null : file("${flutterSdk}/bin/cache/artifacts/engine/android-arm/flutter.jar")

def deriveZebraSpec = { File aar ->
    def base = aar.name[0..-5] // strip .aar
    def matcher = (base =~ /(.*?)-(\d+\.\d+\.\d+\.\d+)$/)
    def artifactId
    def version
    if (matcher.matches()) {
        artifactId = matcher.group(1)
        version = matcher.group(2)
    } else {
        artifactId = base
        version = '1.0.0-local'
    }
    artifactId = artifactId.toLowerCase().replaceAll('[^a-z0-9]+','-')
    [artifactId: artifactId, version: version]
}

def publishZebraAar = { File aar, Map spec ->
    def artifactPath = new File(zebraLocalMaven, zebraGroupId.replace('.', '/') + "/${spec.artifactId}/${spec.version}")
    def pomFile = new File(artifactPath, "${spec.artifactId}-${spec.version}.pom")
    def aarFile = new File(artifactPath, "${spec.artifactId}-${spec.version}.aar")
    if (pomFile.exists() && aarFile.exists()) return
    artifactPath.mkdirs()
    ant.copy(file: aar, tofile: aarFile)
    pomFile.text = """
    <project xmlns=\"http://maven.apache.org/POM/4.0.0\" xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"
        xsi:schemaLocation=\"http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd\">
  <modelVersion>4.0.0</modelVersion>
  <groupId>${zebraGroupId}</groupId>
  <artifactId>${spec.artifactId}</artifactId>
  <version>${spec.version}</version>
  <packaging>aar</packaging>
  <name>${spec.artifactId}</name>
  <description>Locally published Zebra AAR (${aar.name})</description>
</project>
""".trim()
    logger.lifecycle("[zebra] Published ${aar.name} -> ${spec.artifactId}:${spec.version}")
}

if (!zebraAarDir.exists()) {
    throw new GradleException("Required Zebra AAR directory missing: ${zebraAarDir}")
}

def zebraCoordinateList = []
zebraAarDir.listFiles(new FilenameFilter(){ boolean accept(File d, String n) { n.toLowerCase().endsWith('.aar') } })?.each { File aar ->
    def spec = deriveZebraSpec(aar)
    publishZebraAar(aar, spec)
    zebraCoordinateList << "${zebraGroupId}:${spec.artifactId}:${spec.version}"
}

logger.lifecycle("[zebra] Resolved Zebra coordinates: ${zebraCoordinateList}")

tasks.register('publishZebraAarsToLocalMaven') {
    group = 'zebra'
    description = 'Ensures Zebra SDK AARs are published to the local Maven repository.'
    doLast {
        zebraAarDir.listFiles(new FilenameFilter(){ boolean accept(File d, String n) { n.toLowerCase().endsWith('.aar') } })?.each { File aar ->
            def spec = deriveZebraSpec(aar)
            publishZebraAar(aar, spec)
        }
        logger.lifecycle('[zebra] Publication complete')
    }
}

dependencies {
    zebraCoordinateList.each { coord -> implementation(coord) }

    implementation("androidx.core:core-ktx:1.13.1")
    if (flutterEmbeddingJar?.exists()) {
        compileOnly(files(flutterEmbeddingJar))
        testImplementation(files(flutterEmbeddingJar))
    }

    testImplementation("androidx.test:core:1.6.1")
    testImplementation("junit:junit:4.13.2")
    testImplementation("org.jetbrains.kotlin:kotlin-test-junit5:2.1.0")
    testImplementation("org.mockito:mockito-core:5.11.0")
    testImplementation("org.mockito:mockito-inline:5.2.0")
    testImplementation("org.robolectric:robolectric:4.14.1")
    testRuntimeOnly("org.junit.vintage:junit-vintage-engine:5.11.4")
}
// End Dependency Region (flatDir fallback)
